name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      STOCK_IMAGES_URL:
        description: 'URL to OTA zip file (e.g., from manufacturer update server)'
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.209.0.VNIMIXM/ruyi_global-ota_full-OS2.0.209.0.VNIMIXM-user-15.0-7b32cbf246.zip'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      SKIP_CLEANUP:
        description: 'Skip cleanup step (saves time for testing, but may run out of disk space)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
              
    - name: Clean-up
      if: inputs.SKIP_CLEANUP == false
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
    
    - name: Install Device Tree Generator
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip unace unrar zip unzip p7zip-full p7zip-rar sharutils rar uudeview mpack arj cabextract file-roller device-tree-compiler liblzma-dev python3-pip brotli liblz4-tool axel gawk aria2 detox cpio rename liblz4-tool erofs-utils android-sdk-libsparse-utils android-libext4-utils
        pip3 install backports.lzma protobuf pycrypto docopt zstandard brotli extract-dtb pycryptodome
        pip3 install dumpyara aospdtgen
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Download and Process OTA File
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/stock_images
        cd ${GITHUB_WORKSPACE}/stock_images
        
        # Download the OTA file
        INPUT_URL="${{ inputs.STOCK_IMAGES_URL }}"
        echo "Downloading OTA file from: $INPUT_URL"
        wget -O ota_file.zip "$INPUT_URL"
        
        # Verify it's a zip file
        FILE_TYPE=$(file -b ota_file.zip | cut -d' ' -f1)
        if [[ "$FILE_TYPE" != "Zip" ]]; then
          echo "Error: The provided file is not a valid OTA zip file"
          echo "File type detected: $FILE_TYPE"
          echo "Please provide a valid OTA zip file URL"
          exit 1
        fi
        
        # Process OTA file with dumpyara
        echo "Processing OTA file with dumpyara..."
        python3 -m dumpyara ota_file.zip
        
        # Find the dump directory created by dumpyara
        DUMP_DIR=$(find . -maxdepth 1 -type d -name "*dump*" | head -n 1)
        if [ -z "$DUMP_DIR" ]; then
          echo "Dumpyara failed to create dump directory"
          exit 1
        fi
        
        echo "DUMP_DIR=${GITHUB_WORKSPACE}/stock_images/${DUMP_DIR}" >> $GITHUB_ENV
        echo "Dump created at: ${DUMP_DIR}"
      
    - name: Set-up Manifest
      if: inputs.MANIFEST_BRANCH == '11.0' || inputs.MANIFEST_BRANCH == '12.1'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Generate Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/stock_images
        
        # Generate device tree using aospdtgen
        python3 -m aospdtgen ${DUMP_DIR}
        
        # Find the generated device tree directory
        # aospdtgen creates device/<manufacturer>/<codename>
        GENERATED_BASE=$(find . -type d -path "*/device/*/*" | head -n 1)
        if [ -z "$GENERATED_BASE" ]; then
          echo "Device tree generation failed"
          exit 1
        fi
        
        echo "Generated device tree at: ${GENERATED_BASE}"
        
        # Extract device information from the path
        # Path format is ./device/<manufacturer>/<codename>
        DEVICE_NAME=$(basename ${GENERATED_BASE})
        MANUFACTURER=$(basename $(dirname ${GENERATED_BASE}))
        DEVICE_PATH="device/${MANUFACTURER}/${DEVICE_NAME}"
        
        echo "DEVICE_NAME=${DEVICE_NAME}" >> $GITHUB_ENV
        echo "DEVICE_PATH=${DEVICE_PATH}" >> $GITHUB_ENV
        echo "MANUFACTURER=${MANUFACTURER}" >> $GITHUB_ENV
        echo "GENERATED_TREE_DIR=${GITHUB_WORKSPACE}/stock_images/${GENERATED_BASE}" >> $GITHUB_ENV
        
        echo "Device Name: ${DEVICE_NAME}"
        echo "Manufacturer: ${MANUFACTURER}"
        echo "Device Path: ${DEVICE_PATH}"
        
        # Navigate to the generated device tree
        cd ${GITHUB_WORKSPACE}/stock_images/${GENERATED_BASE}
        
        # Ensure AndroidProducts.mk has twrp product
        if [ -f "AndroidProducts.mk" ]; then
          # Check if twrp product exists
          if ! grep -q "twrp_${DEVICE_NAME}" AndroidProducts.mk; then
            # Add twrp product if it doesn't exist
            if grep -q "lineage_${DEVICE_NAME}" AndroidProducts.mk; then
              # Copy lineage config to twrp
              if [ -f "lineage_${DEVICE_NAME}.mk" ]; then
                cp "lineage_${DEVICE_NAME}.mk" "twrp_${DEVICE_NAME}.mk"
                sed -i "s/lineage_/twrp_/g" "twrp_${DEVICE_NAME}.mk"
                sed -i "s/lineage/twrp/g" "twrp_${DEVICE_NAME}.mk"
                echo "PRODUCT_MAKEFILES += \$""(LOCAL_DIR)/twrp_${DEVICE_NAME}.mk" >> AndroidProducts.mk
              fi
            fi
          fi
        fi
        
        # Create or update twrp product file if needed
        if [ ! -f "twrp_${DEVICE_NAME}.mk" ]; then
          echo "Creating twrp_${DEVICE_NAME}.mk"
          {
            echo "# Inherit from device"
            echo "\$(call inherit-product, device/${MANUFACTURER}/${DEVICE_NAME}/device.mk)"
            echo ""
            echo "# Inherit some common TWRP stuff"
            echo "\$(call inherit-product, vendor/twrp/config/common.mk)"
            echo ""
            echo "# Device identifier"
            echo "PRODUCT_DEVICE := ${DEVICE_NAME}"
            echo "PRODUCT_NAME := twrp_${DEVICE_NAME}"
            echo "PRODUCT_BRAND := ${MANUFACTURER}"
            echo "PRODUCT_MODEL := ${DEVICE_NAME}"
            echo "PRODUCT_MANUFACTURER := ${MANUFACTURER}"
          } > "twrp_${DEVICE_NAME}.mk"
        fi
        
        ls -la
        echo "Device tree configured for OrangeFox/TWRP build"
    
    - name: Copy Device Tree to Build Directory
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        mkdir -p $(dirname ${DEVICE_PATH})
        cp -r ${GENERATED_TREE_DIR} ${DEVICE_PATH}
        cd ${DEVICE_PATH}
        ls -la
        echo "Device tree copied to ${DEVICE_PATH}"

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${DEVICE_NAME}-eng && make clean && mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        
        # Set stock images URL for release notes
        echo "STOCK_IMAGES_URL=${{ inputs.STOCK_IMAGES_URL }}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }} (${{ env.MANUFACTURER }})
          Stock Images: ${{ env.STOCK_IMAGES_URL }}
          
          **Note:** This build was automatically generated using aospdtgen from stock images.
          
